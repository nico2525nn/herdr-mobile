name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The wrapper is committed without the executable bit.
      - name: Make Gradle wrapper and tool scripts executable
        run: chmod +x gradlew tools/*.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Unit tests still compile the Android modules, so the compileSdk 37
      # platform has to be present even though no device is involved.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Online resolution: a cold runner has no Gradle dependency cache.
      - name: Run unit tests with coverage
        run: ./gradlew test -Pcoverage --console=plain

      # The unit tests never exercise R8, release resource shrinking, the
      # release ABI filter, or the JNI symbol contract. Build both here.
      - name: Release assembly, lint, and JNI contract
        run: |
          ./gradlew :app:assembleRelease :terminal-ghostty:assembleDebug :app:lintDebug --console=plain
          tools/check-jni.sh
          # The default release is arm64-only; build and inspect the 32-bit
          # artifact too (the release convention ships both per-ABI APKs).
          ./gradlew :app:assembleRelease -Pabi=armeabi-v7a --console=plain
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk \
            | grep -q 'lib/armeabi-v7a/libghostty_android.so'


      # Coverage is opt-in (-Pcoverage), so only this job resolves JaCoCo.
      # Upload on every run, not just failures: the XML feeds coverage diffing.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "*/build/reports/jacoco/**/*.xml"
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            */build/test-results/**/*.xml
            */build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust daemon tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Run daemon tests
        working-directory: daemon
        run: cargo test --release

  compat-smoke:
    name: Compat smoke (API ${{ matrix.api }})
    # Runtime coverage for the two API bands most likely to regress platform
    # behaviour: API 29 (no POST_NOTIFICATIONS, ServiceCompat 3-arg FGS) and
    # API 33 (notification permission + first target-SDK enforcement). Runs on
    # main and manual dispatch, not on every PR (two extra AVDs are expensive).
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Make Gradle wrapper and tool scripts executable
        run: chmod +x gradlew tools/*.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install herdr and smoke dependencies
        run: |
          set -euo pipefail
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/herdr" --version
          if ! python3 -c 'import PIL' 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-pil
          fi

      - name: Run compatibility smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: medium_phone
          avd-name: HerdrCompat${{ matrix.api }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          script: bash tools/ci.sh

  android:
    name: Emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The wrapper is committed without the executable bit; tools/ci.sh calls
      # ./gradlew directly to build the APK.
      - name: Make Gradle wrapper and tool scripts executable
        run: chmod +x gradlew tools/*.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Without an explicit package list the action tries to install the
          # retired `tools` package and fails before the emulator starts.
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # tools/ci.sh boots nothing when a device is already attached, so the AVD
      # the workflow resolves here only has to match the image the emulator
      # runner creates.
      - name: Resolve system image, AVD and SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          LIST="$("$SDKMANAGER" --list 2>/dev/null | tr -d '\r')"
          packages() { printf '%s\n' "$LIST" | awk '{print $1}' | sed 's#/#;#g' | sort -u; }
          has() { packages | grep -Fxq "$1"; }

          IMAGE=""
          API_LEVEL=""
          IMAGE_TARGET=""
          for candidate in 37.0 36 35; do
            for target in google_apis google_apis_playstore default; do
              if has "system-images;android-$candidate;$target;x86_64"; then
                IMAGE="system-images;android-$candidate;$target;x86_64"
                API_LEVEL="$candidate"
                IMAGE_TARGET="$target"
                break 2
              fi
            done
          done
          if [ -z "$IMAGE" ]; then
            echo "No x86_64 system image for API 37/36/35 in the SDK repository" >&2
            exit 1
          fi

          PLATFORM="platforms;android-37.0"
          if ! has "$PLATFORM"; then PLATFORM="platforms;android-37"; fi
          if ! has "$PLATFORM"; then
            echo "No Android 37 platform package in the SDK repository" >&2
            exit 1
          fi

          BUILD_TOOLS="build-tools;36.0.0"
          if ! has "$BUILD_TOOLS"; then
            BUILD_TOOLS="$(packages | grep -E '^build-tools;3[67]\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          fi

          echo "Installing $PLATFORM $BUILD_TOOLS (system image $IMAGE comes with the emulator runner)"
          "$SDKMANAGER" --install "$PLATFORM" "$BUILD_TOOLS"

          echo "API_LEVEL=$API_LEVEL" >> "$GITHUB_ENV"
          echo "SYSTEM_IMAGE_TARGET=$IMAGE_TARGET" >> "$GITHUB_ENV"
          echo "AVD=Medium_Phone_API_$API_LEVEL" >> "$GITHUB_ENV"
          echo "resolved API $API_LEVEL ($IMAGE_TARGET); AVD Medium_Phone_API_$API_LEVEL"

      # Warm AVD + adb keys for repeat runs. Keyed by the resolved API level and
      # target, so a cache miss (first run, or a new image) still creates and
      # boots the AVD normally; a hit restores the snapshot and skips cold boot.
      - name: Cache AVD
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: avd-${{ runner.os }}-api-${{ env.API_LEVEL }}-${{ env.SYSTEM_IMAGE_TARGET }}

      - name: Install herdr and smoke dependencies
        run: |
          set -euo pipefail
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/herdr" --version
          if ! python3 -c 'import PIL' 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-pil
          fi

      - name: Run emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.SYSTEM_IMAGE_TARGET }}
          arch: x86_64
          profile: medium_phone
          avd-name: ${{ env.AVD }}
          # Reuse the AVD restored from cache instead of deleting and
          # recreating it every run; on a cache miss the action creates it.
          force-avd-creation: false
          # The action's default options minus -no-snapshot: the AVD cache only
          # saves boot time if the quick-boot snapshot is loaded (and saved
          # again by `adb emu kill` at the end of the run).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          script: bash tools/ci.sh

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: |
            app/build/smoke-artifacts
            build/smoke-artifacts
            build/ci
            */build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 7
