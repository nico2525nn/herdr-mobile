[package]
name = "herdr-mobile-daemon"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "herdr-mobile-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "signal"] }
axum = { version = "=0.8.9", features = ["ws", "macros"] }
tower-http = { version = "=0.6.11", features = ["trace"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
futures-util = "=0.3.34"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
rand = { version = "=0.8.8", features = ["std", "std_rng"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
time = { version = "=0.3.55", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "signal"] }
